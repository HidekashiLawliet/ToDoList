<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Login - ToDo List</title>
        <meta name="description" content="A ToDo list with sub-tasks, a Pomodoro focus timer and a weather widget.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Tiny inline icon: no extra request for /favicon.ico -->
        <link rel="icon"
            href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Ctext%20y=%27.9em%27%20font-size=%2790%27%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="login-page">
        <main class="login">
            <div id="login_card_body">
                <div id="login_text_area">
                    <h1 id="login_title">Login</h1>
                    <p id="login_subtitle">Please enter your credentials to access your tasks.</p>
                </div>
                <!-- Filled by js/login.js when the URL has ?error=... -->
                <p id="login_error" role="alert" hidden></p>
                <!-- One form, two modes: Login or Create Account -->
                <form id="login_form" action="/userlogin" method="POST">
                    <label for="username">Pseudonyme:</label>
                    <input type="text" id="username" name="username" maxlength="50" autocomplete="username" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <p id="password_hint" hidden>8 to 72 characters.</p>

                    <!-- Disabled while logging in: not shown, checked or sent -->
                    <label for="confirm_password" id="confirm_label" hidden>Confirm password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required disabled hidden>

                    <button type="submit" id="submit_btn">Login</button>
                </form>
                <!-- Outside the form: only switches modes, never submits -->
                <button type="button" id="switch_btn" class="secondary">Create Account</button>
            </div>
        </main>
        <script src="js/login.js" defer></script>
    </body>

</html>
